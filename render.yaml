services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      - key: HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: finance-tracker-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_REDIRECT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini

databases:
  - name: finance-tracker-db
    databaseName: finance
    plan: free
    postgresMajorVersion: "16"
