server:
  port: ${PORT:3000}
  address: 0.0.0.0
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  config:
    # Load the repo-local .env file (KEY=VALUE) when present, so `cp .env.example .env`
    # works out of the box. Real env vars always take precedence over the file.
    import: optional:file:.env[.properties]
  application:
    name: finance-tracker-api
  lifecycle:
    timeout-per-shutdown-phase: 25s
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DATABASE_USER:finance}
    password: ${DATABASE_PASSWORD:finance}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      # Neon pooler (PgBouncer) drops idle connections, so keep Hikari's
      # max-lifetime shorter than that to replace connections before the
      # server closes them (avoids "Failed to validate connection" noise).
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

app:
  neon:
    auth-url: ${NEON_AUTH_URL:}
    jwt-secret: ${NEON_JWT_SECRET:}
    # Origin header sent on server-to-server Neon Auth calls. Better Auth rejects
    # POSTs without an Origin (MISSING_ORIGIN) unless the body has an absolute
    # callbackURL. Set it to one of your trusted origins (Neon Console → Auth).
    auth-origin: ${NEON_AUTH_ORIGIN:}
  auth:
    # Fallback landing URL for password-recovery emails when the client does not
    # send redirect_url. Usually a deep link into the app (e.g. myapp://reset-password).
    redirect-url: ${AUTH_REDIRECT_URL:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  gmail:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Must match an authorized redirect URI on the Google OAuth client and be
    # reachable from the user's browser (absolute URL, e.g. https://api.example.com/api/v1/sync/gmail/callback).
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    scopes: ${GOOGLE_SCOPES:https://www.googleapis.com/auth/gmail.readonly}
  sync:
    # AES key for OAuth tokens at rest. Falls back to NEON_JWT_SECRET when blank.
    encryption-key: ${SYNC_ENCRYPTION_KEY:}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:8081}
  seed-user-id: ${SEED_USER_ID:00000000-0000-4000-8000-000000000001}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} [rid=%X{rid} uid=%X{uid}] : %m%n"
  level:
    root: INFO
    com.finance.tracker: ${LOG_LEVEL:DEBUG}
