server:
  port: ${PORT:3000}
  address: 0.0.0.0
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: finance-tracker-api
  lifecycle:
    timeout-per-shutdown-phase: 25s
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DATABASE_USER:finance}
    password: ${DATABASE_PASSWORD:finance}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

app:
  supabase:
    url: ${SUPABASE_URL:https://example.supabase.co}
    anon-key: ${SUPABASE_ANON_KEY:test-anon-key}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:test-service-role-key}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  auth:
    # Fallback landing URL for password-recovery emails when the client does not
    # send redirect_url. Usually a deep link into the app (e.g. myapp://reset-password).
    redirect-url: ${AUTH_REDIRECT_URL:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:8081}
  seed-user-id: ${SEED_USER_ID:00000000-0000-4000-8000-000000000001}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} [rid=%X{rid} uid=%X{uid}] : %m%n"
  level:
    root: INFO
    com.finance.tracker: ${LOG_LEVEL:DEBUG}
